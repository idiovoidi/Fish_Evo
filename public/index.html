<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Navigation Mesh Demo - Babylon.js + Recast</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <link rel="icon" href="data:,">
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <!-- Load libraries in correct order -->
    <script src="lib/babylon.js"></script>
    <script src="lib/babylonjs.loaders.js"></script>
    <script src="lib/recast.js"></script>
    <!-- Initialize app only after libraries are loaded -->
    <script>
        async function initializeRecast() {
            return new Promise((resolve, reject) => {
                if (typeof Recast !== 'undefined') {
                    resolve(new Recast());
                } else {
                    reject(new Error('Recast library not loaded'));
                }
            });
        }

        async function checkLibraries() {
            return new Promise((resolve, reject) => {
                const maxAttempts = 20;
                let attempts = 0;
                
                function check() {
                    if (typeof BABYLON !== 'undefined' && typeof Recast !== 'undefined') {
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        reject(new Error('Failed to load required libraries'));
                    } else {
                        attempts++;
                        setTimeout(check, 100);
                    }
                }
                
                check();
            });
        }

        // Initialize everything in sequence
        checkLibraries()
            .then(() => initializeRecast())
            .then(() => {
                const script = document.createElement('script');
                script.src = 'js/navmesh.js';
                document.body.appendChild(script);
            })
            .catch(error => {
                console.error('Error loading libraries:', error);
                alert('Failed to load required libraries. Please refresh the page.');
            });
    </script>
</body>
</html>
