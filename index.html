<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Yuka + Babylon.js Navigation Demo</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <!-- Add favicon to prevent 404 error -->
    <link rel="icon" href="data:,">
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <!-- Load libraries first -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://unpkg.com/yuka"></script>
    <!-- Initialize app only after libraries are loaded -->
    <script>
        // Check if libraries are loaded
        function checkLibraries() {
            return new Promise((resolve, reject) => {
                const maxAttempts = 20;
                let attempts = 0;
                
                function check() {
                    if (typeof YUKA !== 'undefined' && typeof BABYLON !== 'undefined') {
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        reject(new Error('Failed to load required libraries'));
                    } else {
                        attempts++;
                        setTimeout(check, 100);
                    }
                }
                
                check();
            });
        }

        // Load our app only after libraries are confirmed loaded
        checkLibraries()
            .then(() => {
                const script = document.createElement('script');
                script.src = 'app.js';
                document.body.appendChild(script);
            })
            .catch(error => {
                console.error('Error loading libraries:', error);
                alert('Failed to load required libraries. Please refresh the page.');
            });
    </script>
</body>
</html>
