<!DOCTYPE html>
<html>
<head>
    <title>Fish Behavior Test</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 5px; }
        #renderCanvas { width: 100%; height: 80vh; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Fish Behavior Test</h3>
        <p>Watch for:</p>
        <ul>
            <li>Fish swimming in coordinated schools</li>
            <li>Proper separation and cohesion behavior</li>
            <li>Realistic directional movement</li>
            <li>Boundary bouncing effects</li>
        </ul>
        <p>FPS: <span id="fps">--</span></p>
        <p>Fish Count: <span id="fishCount">--</span></p>
    </div>
    
    <canvas id="renderCanvas"></canvas>

    <!-- Include ECSY -->
    <script src="https://unpkg.com/ecsy@0.4.3/build/ecsy.min.js"></script>
    
    <!-- Include Babylon.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.0.0/babylon.min.js"></script>
    
    <!-- Include project configuration -->
    <script src="config/simulation_config.js"></script>
    
    <!-- Include all components (order matters for dependencies) -->
    <script type="module">
        // Import and start the simulation
        import { Simulation } from './core/Simulation.js';
        import { Scene as SceneManager } from './core/Scene.js';
        import { Camera } from './core/Camera.js';
        
        // Setup canvas and engine
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        // Create Babylon scene
        const scene = new BABYLON.Scene(engine);
        scene.createDefaultCameraController = false;
        
        // Setup basic lighting
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.7;
        
        // Setup camera
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/2.5, 50, BABYLON.Vector3.Zero(), scene);
        camera.attachToCanvas(canvas, true);
        
        // Create water-like ground
        const ground = BABYLON.CreateGround("ground", {width: 200, height: 200}, scene);
        const waterMaterial = new BABYLON.StandardMaterial("water", scene);
        waterMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.3, 0.8);
        waterMaterial.alpha = 0.6;
        ground.material = waterMaterial;
        ground.position.y = -2;
        
        // Initialize simulation
        const simulation = new Simulation();
        const sceneManager = new SceneManager();
        
        // Start simulation
        simulation.initialize(scene);
        
        // FPS counter
        let lastFpsUpdate = 0;
        const fpsElement = document.getElementById("fps");
        const fishCountElement = document.getElementById("fishCount");
        
        // Render loop
        engine.runRenderLoop(() => {
            scene.render();
            
            // Update info display
            const now = performance.now();
            if (now - lastFpsUpdate > 500) { // Update every 500ms
                fpsElement.textContent = engine.getFps().toFixed(0);
                
                // Count fish entities
                const fishCount = simulation.world.entityManager.queryComponents([
                    simulation.world.componentsManager.getComponentType(window.FishTag)
                ]).length;
                fishCountElement.textContent = fishCount;
                
                lastFpsUpdate = now;
            }
        });
        
        // Handle window resize
        window.addEventListener("resize", () => {
            engine.resize();
        });
        
        // Cleanup on page unload
        window.addEventListener("beforeunload", () => {
            simulation.cleanup();
            engine.dispose();
        });
        
        console.log("Fish behavior test loaded. Watch the fish swimming patterns!");
    </script>
</body>
</html>
