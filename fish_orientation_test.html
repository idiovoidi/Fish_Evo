<!DOCTYPE html>
<html>
<head>
    <title>Fish Orientation Test</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 8px; }
        #renderCanvas { width: 100%; height: 80vh; border: 2px solid #333; }
        .highlight { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">
        <h3>🐟 Fish Orientation Test</h3>
        <p><span class="highlight">Fixed:</span> Fish now face their swimming direction!</p>
        <ul>
            <li>✅ Dynamic rotation based on velocity</li>
            <li>✅ Smooth orientation interpolation</li>
            <li>✅ Natural banking when turning</li>
            <li>✅ Random initial orientations</li>
        </ul>
        <p>FPS: <span id="fps">--</span></p>
        <p><em>Watch the fish turn naturally as they swim!</em></p>
    </div>
    
    <canvas id="renderCanvas"></canvas>

    <script src="https://unpkg.com/ecsy@0.4.3/build/ecsy.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.0.0/babylon.min.js"></script>
    <script src="config/simulation_config.js"></script>
    
    <script type="module">
        import { Simulation } from './core/Simulation.js';
        
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        // Lighting
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.7;
        
        // Camera positioned to see fish movement clearly
        const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/2.5, 30, BABYLON.Vector3.Zero(), scene);
        camera.attachToCanvas(canvas, true);
        
        // Simple ocean floor
        const ground = BABYLON.CreateGround("ground", {width: 100, height: 100}, scene);
        const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
        groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.5, 0.8);
        groundMat.alpha = 0.3;
        ground.material = groundMat;
        ground.position.y = -2;
        
        // Start simulation
        const simulation = new Simulation();
        simulation.initialize(scene);
        
        // Stats tracking
        let lastStatsUpdate = 0;
        engine.runRenderLoop(() => {
            scene.render();
            
            const now = performance.now();
            if (now - lastStatsUpdate > 500) {
                document.getElementById("fps").textContent = engine.getFps().toFixed(0);
                lastStatsUpdate = now;
            }
        });
        
        window.addEventListener("resize", () => engine.resize());
        window.addEventListener("beforeunload", () => simulation.cleanup());
        
        console.log("🐟 Fish orientation test ready! Watch them turn as they swim!");
    </script>
</body>
</html>
