<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Seaweed Test - Babylon.js</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-family: Arial, sans-serif;
            border-radius: 5px;
        }
        button {
            margin: 5px;
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="controls">
        <h3>Seaweed Test</h3>
        <button id="kelpBtn">Create Kelp</button>
        <button id="seagrassBtn">Create Seagrass</button>
        <button id="algaeBtn">Create Algae</button>
        <button id="randomBtn">Create Random</button>
        <button id="clearBtn">Clear All</button>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="seaweed.js"></script>
    
    <script>
        // Initialize Babylon.js scene
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        // Create camera
        const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2, Math.PI / 3, 15, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        camera.lowerRadiusLimit = 5;
        camera.upperRadiusLimit = 50;
        
        // Create light
        const light = new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.7;
        
        // Create ground
        const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 20, height: 20 }, scene);
        const groundMaterial = new BABYLON.StandardMaterial('groundMaterial', scene);
        groundMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.3);
        ground.material = groundMaterial;
        
        // Create water surface
        const water = BABYLON.MeshBuilder.CreateGround('water', { width: 20, height: 20 }, scene);
        water.position.y = 5;
        const waterMaterial = new BABYLON.StandardMaterial('waterMaterial', scene);
        waterMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.2, 0.4);
        waterMaterial.alpha = 0.5;
        water.material = waterMaterial;
        
        // Store created seaweeds
        const seaweeds = [];
        
        // Button event handlers
        document.getElementById('kelpBtn').addEventListener('click', () => {
            createSeaweed('kelp');
        });
        
        document.getElementById('seagrassBtn').addEventListener('click', () => {
            createSeaweed('seagrass');
        });
        
        document.getElementById('algaeBtn').addEventListener('click', () => {
            createSeaweed('algae');
        });
        
        document.getElementById('randomBtn').addEventListener('click', () => {
            const types = ['kelp', 'seagrass', 'algae'];
            const type = types[Math.floor(Math.random() * types.length)];
            createSeaweed(type);
        });
        
        document.getElementById('clearBtn').addEventListener('click', () => {
            clearSeaweeds();
        });
        
        // Function to create seaweed
        function createSeaweed(type) {
            // Random position
            const x = (Math.random() - 0.5) * 10;
            const z = (Math.random() - 0.5) * 10;
            const position = new BABYLON.Vector3(x, 0, z);
            
            // Random properties
            const height = 3 + Math.random() * 5;
            const segments = 5 + Math.floor(Math.random() * 6);
            const width = 0.3 + Math.random() * 0.5;
            
            // Random color based on type
            let color;
            switch (type) {
                case 'kelp':
                    color = new BABYLON.Color3(0.1 + Math.random() * 0.1, 0.4 + Math.random() * 0.1, 0.1);
                    break;
                case 'seagrass':
                    color = new BABYLON.Color3(0.2 + Math.random() * 0.1, 0.5 + Math.random() * 0.1, 0.2);
                    break;
                case 'algae':
                    color = new BABYLON.Color3(0.1 + Math.random() * 0.1, 0.3 + Math.random() * 0.1, 0.2 + Math.random() * 0.1);
                    break;
                default:
                    color = new BABYLON.Color3(0.1, 0.5, 0.1);
            }
            
            // Create seaweed
            const seaweed = new Seaweed(scene, position, {
                type: type,
                height: height,
                segments: segments,
                width: width,
                color: color,
                variation: Math.random()
            });
            
            seaweeds.push(seaweed);
        }
        
        // Function to clear all seaweeds
        function clearSeaweeds() {
            seaweeds.forEach(seaweed => {
                seaweed.dispose();
            });
            seaweeds.length = 0;
        }
        
        // Create initial seaweeds
        for (let i = 0; i < 5; i++) {
            const types = ['kelp', 'seagrass', 'algae'];
            const type = types[Math.floor(Math.random() * types.length)];
            createSeaweed(type);
        }
        
        // Run render loop
        engine.runRenderLoop(() => {
            scene.render();
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            engine.resize();
        });
    </script>
</body>
</html>
