<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Fish Evolution ECS Test</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 10px;
            font-family: monospace;
            z-index: 100;
        }
    </style>
    <!-- Add favicon to prevent 404 error -->
    <link rel="icon" href="data:,">
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="info">
        Fish Evolution Simulation (ECS version)
        <div id="stats"></div>
    </div>
    
    <!-- Load libraries -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <!-- Remove the non-module ecsy script -->
    <!-- <script src="node_modules/ecsy/build/ecsy.min.js"></script> -->
    
    <!-- We use ES modules for our ECS implementation -->
    <script type="module">
        // Import ecsy directly as a module
        import { World, System, Component, Types } from './node_modules/ecsy/build/ecsy.module.js';
        // Make ecsy classes globally available for other modules
        window.ECSY = { World, System, Component, Types };
        
        // Import core classes
        import { Simulation } from './core/Simulation.js';
        
        // Global variables
        window.ecsSimulation = null;
        
        // Initialize BabylonJS scene
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);
        
        // Stats display
        const statsElement = document.getElementById('stats');
        
        async function createScene() {
            // Create the scene
            const scene = new BABYLON.Scene(engine);
            
            // Add a camera
            const camera = new BABYLON.ArcRotateCamera("Camera", 
                Math.PI / 2, Math.PI / 3, 80, 
                BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            
            // Add lighting
            const light = new BABYLON.HemisphericLight("light", 
                new BABYLON.Vector3(0, 1, 0), scene);
            
            // Create a blue semi-transparent ground to represent water
            const ground = BABYLON.MeshBuilder.CreateGround(
                "ground", {width: 100, height: 100}, scene);
            const groundMaterial = new BABYLON.StandardMaterial("groundMat", scene);
            groundMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.9);
            groundMaterial.alpha = 0.6;
            ground.material = groundMaterial;
            ground.position.y = -1;
            
            // Create environment skybox
            const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", {size:1000.0}, scene);
            const skyboxMaterial = new BABYLON.StandardMaterial("skyBoxMaterial", scene);
            skyboxMaterial.backFaceCulling = false;
            skyboxMaterial.diffuseColor = new BABYLON.Color3(0.1, 0.6, 0.8);
            skybox.material = skyboxMaterial;
            
            // Initialize the ECS simulation
            const simulation = new Simulation();
            window.ecsSimulation = simulation;
            
            // Pass the scene to the simulation
            simulation.initialize(scene);
            
            // Update stats display every second
            setInterval(() => {
                if (window.ecsSimulation) {
                    const fishCount = window.ecsSimulation.world.entityManager._entityComponentMap.get(6)?.size || 0; // FishTag
                    const foodCount = window.ecsSimulation.world.entityManager._entityComponentMap.get(7)?.size || 0; // FoodTag
                    statsElement.innerHTML = `
                        Entities: ${window.ecsSimulation.world.stats.numEntities}<br>
                        Fish: ${fishCount}<br>
                        Food: ${foodCount}<br>
                    `;
                }
            }, 1000);
            
            // Return the created scene
            return scene;
        }
        
        // Create the scene
        createScene().then(scene => {
            // Register render loop
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                engine.resize();
            });
        });
    </script>
</body>
</html>
